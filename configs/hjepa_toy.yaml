# Иерархический JEPA: три уровня с шагами 1, 4, 16 кадров.
# Требует последовательность длиной >= max(strides)+1 = 17 кадров.
seed: 0
device: auto
out_dir: runs/hjepa

data:
  n_traj: 4000
  n_val: 128
  length: 24
  env:
    size: 64
    radius: 5.0
    gravity: 0.12
    restitution: 0.92
    accel_scale: 0.35
    max_speed: 4.0
    blur: 2.0

model:
  img_size: 64
  patch_size: 8
  in_chans: 3
  dim: 192
  depth: 6
  heads: 3
  proj_dim: 8
  proj_hidden: 512
  action_dim: 2
  ctx: 2
  horizon: 1
  pred_depth: 2
  pred_hidden: 256
  lamb: 0.05
  inv_weight: 0.5
  metric_weight: 1.0
  probe_weight: 1.0
  sigreg_slices: 256
  hierarchical: true
  levels: 3
  strides: [1, 4, 16]

train:
  epochs: 30
  batch_size: 24
  eval_batch_size: 24
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  amp: true
  workers: 0
  save_every: 10
  probe_steps: 60     # дообучение пробы на eval-латентах (см. train/pretrain.py)
  grad_clip: 0
